spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 25
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  oauth2:
    kakao:
      client-id: test-kakao-id
      client-secret: test-kakao-secret
      redirect-uri: http://localhost/callback/kakao
    google:
      client-id: test-google-id
      client-secret: test-google-secret
      redirect-uri: http://localhost/callback/google

jwt:
  secret: test-secret-key-for-jwt-testing-must-be-at-least-32-characters-long
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

ai:
  anthropic:
    api-key: test-anthropic-key
    model: claude-sonnet-5

google:
  places:
    api-key: test-places-key
